name: Publish release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: coding01.exe
            asset: coding01-windows-x86_64.exe
          - os: ubuntu-latest
            binary: coding01
            asset: coding01-linux-x86_64.bin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client
      - name: Check tag matches Cargo package version
        shell: bash
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 | python -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Prepare updater asset
        shell: bash
        run: cp "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: apps/client/${{ matrix.asset }}
          if-no-files-found: error
  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish official release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "$RELEASE_TAG"
