[package]
name = "coding01"
version = "0.0.1"
edition = "2021"
description = "01 编码 — 轻量原生 AI 编码客户端(egui 原生绘制,接 NullClaw WebChannel)"

[dependencies]
eframe = "=0.27.2"
serde_json = "1"
serde = {version="1",features=["derive"]}
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tungstenite = { version = "0.21.0", default-features = false, features = ["handshake"] }
rfd = "0.14"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sha2 = "0.10"
rand = "0.8"
open = "5"
tiny_http = "0.12"
subtle = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = {version="3",features=["windows-native"]}
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = {version="3",features=["apple-native"]}
[target.'cfg(target_os = "linux")'.dependencies]
keyring = {version="3",features=["sync-secret-service","crypto-rust","vendored"]}

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
