[package]
name = "coding01"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
description = "01 编码 — 轻量原生 AI 编码客户端(egui 原生绘制,接 NullClaw WebChannel)"

[dependencies]
eframe = "=0.27.2"
base64 = "0.22"
libc = "0.2"
tempfile = "3"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tungstenite = { version = "0.21.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rfd = "0.14"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
