<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="01 编码 Logo(浅色)">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FB"/>
    </linearGradient>
    <linearGradient id="skyL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CD2FA"/>
      <stop offset=".45" stop-color="#22A7F0"/>
      <stop offset="1" stop-color="#036FAE"/>
    </linearGradient>
    <linearGradient id="grnL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset=".55" stop-color="#57E19B"/>
      <stop offset="1" stop-color="#12B87A"/>
    </linearGradient>
    <filter id="shBgL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
    <filter id="shL" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0284C7" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgL)" filter="url(#shBgL)"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#0EA5E9" stroke-opacity=".16" stroke-width="2"/>

  <g transform="translate(40 0) skewX(-8)">
    <g filter="url(#shL)">
      <ellipse cx="170" cy="256" rx="91" ry="120" fill="none" stroke="url(#skyL)" stroke-width="54"/>
      <path d="M364 140 V380" fill="none" stroke="url(#grnL)" stroke-width="54" stroke-linecap="round"/>
      <path d="M360 141 L311 172" fill="none" stroke="url(#grnL)" stroke-width="44" stroke-linecap="round"/>
    </g>
  </g>
</svg>
