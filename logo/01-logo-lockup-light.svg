<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="01 编码 一行式组合(亮色底)">
  <defs>
    <linearGradient id="hl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FB"/>
    </linearGradient>
    <linearGradient id="hl-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CD2FA"/>
      <stop offset=".45" stop-color="#22A7F0"/>
      <stop offset="1" stop-color="#036FAE"/>
    </linearGradient>
    <linearGradient id="hl-grn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset=".55" stop-color="#57E19B"/>
      <stop offset="1" stop-color="#12B87A"/>
    </linearGradient>
  </defs>

  <!-- 图标(亮色版) -->
  <g transform="translate(20 18) scale(.32)">
    <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#hl-bg)"/>
    <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="#0EA5E9" stroke-opacity=".18" stroke-width="2"/>
    <g transform="translate(40 0) skewX(-8)">
      <ellipse cx="170" cy="256" rx="91" ry="120" fill="none" stroke="url(#hl-sky)" stroke-width="54"/>
      <path d="M364 140 V380" fill="none" stroke="url(#hl-grn)" stroke-width="54" stroke-linecap="round"/>
      <path d="M360 141 L311 172" fill="none" stroke="url(#hl-grn)" stroke-width="44" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 字标:01 与「编码」同处一行(预览用系统字体,量产请转曲) -->
  <text x="206" y="138" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="104" font-weight="800" letter-spacing="2">
    <tspan fill="url(#hl-sky)">01</tspan><tspan fill="#0F172A" dx="20">编码</tspan>
  </text>
</svg>
